<h2 class="sr-only">Editable weighted comparison matrix for event pipeline options, with addable criteria and products, stored in the browser and shareable via export/import.</h2>

<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:1rem; flex-wrap:wrap;">
  <div style="font-size:13px; color:var(--text-secondary);" id="status">loading...</div>
  <div style="display:flex; gap:8px;">
    <button id="btn-export" style="font-size:13px;"><i class="ti ti-download" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>export JSON</button>
    <button id="btn-import" style="font-size:13px;"><i class="ti ti-upload" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>import JSON</button>
    <input type="file" id="file-import" accept="application/json" style="display:none;">
    <button id="btn-reset" style="font-size:13px;"><i class="ti ti-refresh" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>reset</button>
  </div>
</div>

<div style="overflow-x:auto;">
<table id="matrix" style="width:100%; border-collapse:collapse; font-size:13px;">
  <thead><tr id="head-row"></tr></thead>
  <tbody id="body-rows"></tbody>
</table>
</div>

<div style="display:flex; gap:8px; margin-top:12px;">
  <button id="btn-add-row" style="font-size:13px;"><i class="ti ti-plus" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>add criterion</button>
  <button id="btn-add-col" style="font-size:13px;"><i class="ti ti-plus" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>add product</button>
</div>

<div style="display:flex; gap:16px; margin-top:1rem; padding-top:1rem; border-top:0.5px solid var(--border);">
  <div class="metric" style="background:var(--surface-1); border-radius:var(--radius); padding:1rem; flex:1;">
    <div style="font-size:13px; color:var(--text-secondary);">weighted totals</div>
    <div id="totals" style="font-size:14px; font-weight:500; margin-top:4px; line-height:1.6;"></div>
  </div>
</div>

<p style="font-size:12px; color:var(--text-muted); margin-top:12px;">data is stored per-browser. use export/import to share this file with colleagues.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script>
const KEY = 'zeus_matrix_v1';
const DEFAULT = {
  criteria: [
    {id:'c1', name:'EU residency confirmed', weight:3},
    {id:'c2', name:'No vendor JS on pages', weight:3},
    {id:'c3', name:'Consent enforced pre-storage', weight:3},
    {id:'c4', name:'Clinical data isolation', weight:3},
    {id:'c5', name:'Postgres event store included', weight:2},
    {id:'c6', name:'New infra to run/patch', weight:2},
    {id:'c7', name:'Engineering effort', weight:2},
    {id:'c8', name:'Vendor lock-in / API limits', weight:1},
    {id:'c9', name:'Licence / ToS risk', weight:1},
    {id:'c10', name:'Cost predictability', weight:1}
  ],
  products: [
    {id:'p1', name:'A: RudderStack self-host'},
    {id:'p2', name:'C: own pipeline + Mautic'},
    {id:'p3', name:'E: own pipeline + Customer.io'},
    {id:'p4', name:'F: Customer.io Data Pipelines'}
  ],
  scores: {}
};

let state = null;

function load(){
  try {
    const raw = localStorage;
  } catch(e) {}
}

async function init(){
  try {
    const res = await window.storage.get(KEY, true);
    state = res ? JSON.parse(res.value) : _.cloneDeep(DEFAULT);
  } catch(e) {
    state = _.cloneDeep(DEFAULT);
  }
  document.getElementById('status').textContent = 'shared with anyone who opens this artifact';
  render();
}

async function save(){
  try {
    await window.storage.set(KEY, JSON.stringify(state), true);
  } catch(e) {
    document.getElementById('status').textContent = 'save failed — changes may not persist';
  }
}

function scoreVal(critId, prodId){
  const k = critId + '::' + prodId;
  return state.scores[k] ?? null;
}
function setScore(critId, prodId, val){
  const k = critId + '::' + prodId;
  if (val === '' || val === null) delete state.scores[k];
  else state.scores[k] = Number(val);
}

function render(){
  const headRow = document.getElementById('head-row');
  const bodyRows = document.getElementById('body-rows');
  headRow.innerHTML = '';
  bodyRows.innerHTML = '';

  const thCrit = document.createElement('th');
  thCrit.style.cssText = 'text-align:left; padding:8px; border-bottom:0.5px solid var(--border); min-width:200px;';
  thCrit.textContent = 'criterion';
  headRow.appendChild(thCrit);

  const thWeight = document.createElement('th');
  thWeight.style.cssText = 'text-align:center; padding:8px; border-bottom:0.5px solid var(--border); width:70px;';
  thWeight.textContent = 'weight';
  headRow.appendChild(thWeight);

  state.products.forEach(p => {
    const th = document.createElement('th');
    th.style.cssText = 'text-align:center; padding:8px; border-bottom:0.5px solid var(--border); min-width:130px;';
    const inp = document.createElement('input');
    inp.value = p.name;
    inp.style.cssText = 'width:100%; text-align:center; font-weight:500; font-size:13px;';
    inp.addEventListener('change', e => { p.name = e.target.value; save(); });
    const del = document.createElement('button');
    del.innerHTML = '<i class="ti ti-x" style="font-size:12px;" aria-hidden="true"></i>';
    del.setAttribute('aria-label', 'remove product');
    del.style.cssText = 'font-size:11px; padding:2px 6px; margin-top:4px;';
    del.addEventListener('click', () => { state.products = state.products.filter(x=>x.id!==p.id); Object.keys(state.scores).forEach(k=>{if(k.endsWith('::'+p.id)) delete state.scores[k];}); save(); render(); });
    th.appendChild(inp); th.appendChild(document.createElement('br')); th.appendChild(del);
    headRow.appendChild(th);
  });

  state.criteria.forEach(c => {
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.style.cssText = 'padding:6px 8px; border-bottom:0.5px solid var(--border);';
    const nameInp = document.createElement('input');
    nameInp.value = c.name;
    nameInp.style.cssText = 'width:100%; font-size:13px;';
    nameInp.addEventListener('change', e => { c.name = e.target.value; save(); });
    const del = document.createElement('button');
    del.innerHTML = '<i class="ti ti-trash" style="font-size:12px;" aria-hidden="true"></i>';
    del.setAttribute('aria-label', 'remove criterion');
    del.style.cssText = 'font-size:11px; padding:2px 6px; margin-left:6px;';
    del.addEventListener('click', () => { state.criteria = state.criteria.filter(x=>x.id!==c.id); Object.keys(state.scores).forEach(k=>{if(k.startsWith(c.id+'::')) delete state.scores[k];}); save(); render(); });
    tdName.appendChild(nameInp); tdName.appendChild(del);
    tr.appendChild(tdName);

    const tdWeight = document.createElement('td');
    tdWeight.style.cssText = 'padding:6px 8px; border-bottom:0.5px solid var(--border); text-align:center;';
    const wInp = document.createElement('input');
    wInp.type = 'number'; wInp.min = 0; wInp.max = 5; wInp.step = 1;
    wInp.value = c.weight;
    wInp.style.cssText = 'width:50px; text-align:center;';
    wInp.addEventListener('change', e => { c.weight = Number(e.target.value)||0; save(); computeTotals(); });
    tdWeight.appendChild(wInp);
    tr.appendChild(tdWeight);

    state.products.forEach(p => {
      const td = document.createElement('td');
      td.style.cssText = 'padding:6px 8px; border-bottom:0.5px solid var(--border); text-align:center;';
      const sel = document.createElement('select');
      sel.style.cssText = 'width:100%; font-size:13px;';
      const opts = [['','—'],['2','2 fully meets'],['1','1 partial'],['0','0 fails'],['-1','n/a']];
      opts.forEach(([v,label])=>{
        const o = document.createElement('option');
        o.value=v; o.textContent=label;
        sel.appendChild(o);
      });
      const cur = scoreVal(c.id, p.id);
      sel.value = cur===null ? '' : String(cur);
      sel.addEventListener('change', e => { setScore(c.id,p.id,e.target.value); save(); computeTotals(); });
      td.appendChild(sel);
      tr.appendChild(td);
    });

    bodyRows.appendChild(tr);
  });

  computeTotals();
}

function computeTotals(){
  const out = document.getElementById('totals');
  const lines = state.products.map(p => {
    let total = 0, maxTotal = 0;
    state.criteria.forEach(c => {
      const v = scoreVal(c.id, p.id);
      if (v !== null && v >= 0) {
        total += v * c.weight;
        maxTotal += 2 * c.weight;
      }
    });
    const pct = maxTotal > 0 ? Math.round((total/maxTotal)*100) : 0;
    return `${p.name}: ${total} pts (${pct}%)`;
  });
  out.innerHTML = lines.join('<br>');
}

document.getElementById('btn-add-row').addEventListener('click', () => {
  const id = 'c' + Date.now();
  state.criteria.push({id, name:'new criterion', weight:1});
  save(); render();
});
document.getElementById('btn-add-col').addEventListener('click', () => {
  const id = 'p' + Date.now();
  state.products.push({id, name:'new option'});
  save(); render();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  state = _.cloneDeep(DEFAULT);
  save(); render();
});
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'zeus_pipeline_matrix.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.criteria && parsed.products) {
        state = parsed;
        if (!state.scores) state.scores = {};
        save(); render();
      }
    } catch(err) {
      document.getElementById('status').textContent = 'import failed — invalid file';
    }
  };
  reader.readAsText(file);
});

init();
</script>
